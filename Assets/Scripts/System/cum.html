<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Inspection Panel</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<style>
    * {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: "Inter", Arial, sans-serif;
}

body {
  background: #1e1e1e;
  display: flex;
  justify-content: center;
  align-items: flex-start;
  padding: 30px;
  color: #fff;
  font-size: 16px;
}

.inspection-panel {
  width: 380px;
  background: #2a2a2e;
  padding: 24px;
  border-radius: 12px;
  box-shadow: 0 6px 18px rgba(0, 0, 0, 0.4);
}

.title {
  font-size: 1.5rem;
  font-weight: 600;
}

.subtitle {
  font-size: 0.9rem;
  opacity: 0.7;
  margin-top: 4px;
}

.divider {
  width: 100%;
  height: 1px;
  background: #3c3c40;
  margin: 16px 0;
}

.section {
  margin-bottom: 18px;
}

.label {
  font-size: 0.85rem;
  opacity: 0.7;
  margin-bottom: 4px;
}

.value {
  font-size: 1.3rem;
  font-weight: 500;
}

.value .secondary {
  font-size: 1rem;
  opacity: 0.5;
  margin-left: 6px;
}

.chart-container {
  margin-top: 24px;
}

.chart-title {
  font-size: 0.95rem;
  margin-bottom: 10px;
  opacity: 0.85;
}

.chart-placeholder {
  width: 100%;
  height: 140px;
  background: #1c1c1f;
  border-radius: 10px;
  border: 1px solid #3a3a3e;
}

</style>
<body>
  <div class="inspection-panel">
    <h2 class="title">9V Battery</h2>
    <p class="subtitle">Voltage Source</p>
    <div class="divider"></div>

    <div class="section">
      <p class="label">Voltage</p>
      <p class="value">2.11 V <span class="secondary">/ 2.4 V</span></p>
    </div>

    <div class="section">
      <p class="label">Resistance</p>
      <p class="value">0.01 Ω</p>
    </div>

    <div class="section">
      <p class="label">Current</p>
      <p class="value">240 A <span class="secondary">/ 300 A</span></p>
    </div>

    <div class="section">
      <p class="label">Power</p>
      <p class="value">24 I</p>
    </div>

    <div class="chart-container">
      <p class="chart-title">Current Over Time</p>
      <div class="chart-placeholder"></div>
    </div>
  </div>
</body>
</html>
